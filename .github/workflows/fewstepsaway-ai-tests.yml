name: FewStepsAway AI Module Tests

on:
  push:
    paths:
      - 'src/vs/ai/**'
      - 'src/vs/workbench/contrib/aiChat/**'
      - 'test/mcp/src/automationTools/chat.ts'
      - 'test/smoke/src/areas/fewstepsaway/**'
      - '.github/workflows/fewstepsaway-ai-tests.yml'
  pull_request:
    paths:
      - 'src/vs/ai/**'
      - 'src/vs/workbench/contrib/aiChat/**'
      - 'test/mcp/src/automationTools/chat.ts'
      - 'test/smoke/src/areas/fewstepsaway/**'

jobs:
  ai-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Run AI module unit tests
        run: bun run test-ai
